# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "40128ca5d894434595dd2e603d7fe517"
name = "Stockly"
application_url = "https://stockly-production-5ccf.up.railway.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_customers — needed to write the wholesale-status metafield on
# customers from the orders/paid webhook handler (ADR-004 FPQ flow).
# read_orders     — Shopify requires this scope to subscribe to the
# orders/paid webhook (otherwise app config update fails with
# "Missing scope for webhook topic: orders/paid").
# write_validations — create/update the Cart & Checkout Validation that
# enforces the opening-order minimum at checkout (Camino B / ADR-016).
# read_themes — read the active theme's settings_data.json so the admin
# Setup guide can auto-detect whether the "Stockly" app embed is enabled
# (the "Activate Stockly" step + its Refresh button).
scopes = "write_products,write_publications,write_discounts,write_customers,read_orders,write_validations,read_themes"

# Protected customer data access — required since 2024 for ANY app
# that reads/creates Customer records with PII (name, email, phone).
# Without this, customerCreate / customers(query:email:...) return
# ACCESS_DENIED even with write_customers scope granted.
# For dev stores, approval is immediate when configured here.
[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = false

[access.protected_customer_data_permissions]
customer_data = "level_1"
customer_fields = [
  { customer_field = "name", permission = "level_1" },
  { customer_field = "email", permission = "level_1" },
  { customer_field = "phone", permission = "level_1" },
]

[webhooks]
# Match SDK's ApiVersion.January25 — 2026-07 doesn't exist yet (today is 2026-05).
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # GDPR / privacy-law mandatory webhooks (B0-1).
  # App Store auto-rejects submission without these. Each topic uses
  # its own subscription block. Note: the toml key for these is
  # `compliance_topics` (NOT `topics`) — Shopify validates the key
  # strictly. Handler routes live at app/routes/webhooks.*.tsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  # customers/update — detects when a customer receives the shop's
  # wholesale tag via an external approval flow (e.g. Piro's native
  # B2B form). Automatically enrolls them in Stockly's opening-order
  # pending list so the first-purchase minimum is enforced at checkout.
  # Uses the existing customer_data = "level_1" declaration.
  #
  # HISTORY: disabled 2026-08-05 because a brand-new app has no
  # protected-customer-data approval and Shopify refused to create a version
  # while subscribing to a protected topic ("This app is not approved to
  # subscribe to webhook topics containing protected customer data").
  #
  # RE-ENABLED 2026-08-11. Partners' "API access requests" page offers no
  # protected-customer-data request at all (only: read-all-orders,
  # subscriptions, payment mandates, post-purchase, network access), and the
  # Piro install-consent screen explicitly listed "Ver datos de clientes —
  # Datos sensibles". Hypothesis: for custom-distribution apps the grant comes
  # from merchant consent at install, not a Partners review. This re-enable IS
  # the experiment — if `shopify app deploy --config=piro` succeeds, the
  # hypothesis holds; if it fails with the same error, revert and find the
  # request flow elsewhere.
  # RE-ENABLED on the PUBLIC app 2026-08-21. It was disabled on 2026-08-11
  # because a brand-new public app had no protected-customer-data approval and
  # Shopify refused to create a version while it subscribed to a protected
  # topic ("This app is not approved to subscribe to webhook topics containing
  # protected customer data"). That approval landed with the App Store
  # approval on 2026-08-21 — Partners → API access requests now reads
  # "Protected customer data access: Approved, Aug 21, 2026" — so the
  # subscription is legal again. No scope change: it rides on the
  # already-granted write_customers, so no re-consent on installed shops.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = [ "customers/update" ]

# orders/paid (ADR-004 FPQ qualification + company-first qualification).
# ENABLED 2026-08-22: protected customer data access was approved with
# the App Store approval ("Approved, Aug 21, 2026" in Partners → API
# access requests), which is the condition that had kept this commented
# out since pre-launch. The handler at app/routes/webhooks.orders.paid.tsx
# now also marks the purchasing COMPANY qualified (native B2B) via its
# app-owned metafield — the state both checkout Functions read.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [
  "https://stockly-production-5ccf.up.railway.app/auth/callback",
  "https://stockly-production-5ccf.up.railway.app/auth/shopify/callback",
  "https://stockly-production-5ccf.up.railway.app/api/auth/callback"
]

[app_proxy]
# Storefront URL /apps/stockly/* is forwarded to our backend /proxy/*.
# The full proxy URL is set automatically by the CLI to the dev tunnel
# during development, and to the production app URL on deploy.
url = "https://stockly-production-5ccf.up.railway.app/proxy"
subpath = "stockly"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
