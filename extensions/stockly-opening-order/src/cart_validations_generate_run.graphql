query CartValidationsGenerateRunInput {
  buyerJourney {
    # Which stage the buyer is at. CART_INTERACTION = still building the
    # cart (add/remove) — the gate must NOT fire there, or the very first
    # "add to cart" of a below-minimum cart is rejected and the buyer can
    # never assemble an order that meets the minimum. The gate fires at
    # CHECKOUT_INTERACTION / CHECKOUT_COMPLETION, which is still fully
    # server-side and unskippable.
    step
  }
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      quantity
    }
    buyerIdentity {
      customer {
        id
      }
      purchasingCompany {
        company {
          id
          # App-owned qualification flag written by the backend when the
          # company completes its first qualifying order (orders/paid
          # webhook) or is backfilled as an established customer. The
          # namespace resolves to this app's reserved namespace, so no
          # other app can spoof it.
          metafield(namespace: "$app:stockly", key: "qualified") {
            value
          }
        }
        location {
          id
        }
      }
    }
  }
  validation {
    metafield(namespace: "$app:stockly-opening-order", key: "function-configuration") {
      value
    }
  }
}
