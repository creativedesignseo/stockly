query CartValidationsGenerateRunInput {
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      quantity
    }
    buyerIdentity {
      customer {
        id
      }
      purchasingCompany {
        company {
          id
          # App-owned qualification flag written by the backend when the
          # company completes its first qualifying order (orders/paid
          # webhook) or is backfilled as an established customer. The
          # namespace resolves to this app's reserved namespace, so no
          # other app can spoof it.
          metafield(namespace: "$app:stockly", key: "qualified") {
            value
          }
        }
        location {
          id
        }
      }
    }
  }
  validation {
    metafield(namespace: "$app:stockly-opening-order", key: "function-configuration") {
      value
    }
  }
}
