query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
    buyerIdentity {
      customer {
        id
        hasAnyTag(tags: ["wholesale"])
      }
      purchasingCompany {
        company {
          id
          # Same app-owned qualification flag the Validation Function
          # reads: written by the backend when the company completes its
          # first qualifying order (or is backfilled as established).
          metafield(namespace: "$app:stockly", key: "qualified") {
            value
          }
        }
      }
    }
  }
  discountNode {
    metafield(namespace: "$app:stockly-volume-discount", key: "function-configuration") {
      value
    }
  }
  shop {
    localTime {
      date
    }
  }
}
